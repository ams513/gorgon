 canvas.addEventListener('pointerdown',onDown);canvas.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);
 var api={kind:'2d',world:world,
  setMood:function(name){if(MOODS[name]){world.mood=name;S.mood=MOODS[name];}},setTool:function(t){S.tool=t;},
  setMode:function(m){world.tiles=(S.mode==='edit')?grid.map(function(r){return r.join('');}):world.tiles;S.mode=m;reset();buildSprite();},
  toggleDrone:function(){return false;},postcard:function(cb){S.shot=cb;},state:function(){return S;},refreshSprite:buildSprite,
  destroy:function(){cancelAnimationFrame(S.raf);input.dispose();window.removeEventListener('pointerup',onUp);}};
 input.onKey=function(c){if(c==='KeyP'&&opt.onPostcard)opt.onPostcard();};
 S.raf=requestAnimationFrame(frame);return api;}
function create(canvas,world,opt){return world.mode==='2d'?create2D(canvas,world,opt):create3D(canvas,world,opt);}
return{MOODS:MOODS,SFX:SFX,create:create,sfxSamples:sfxSamples,wavBytes:wavBytes,playSfx:playSfx,terrainH:terrainH};
})();
