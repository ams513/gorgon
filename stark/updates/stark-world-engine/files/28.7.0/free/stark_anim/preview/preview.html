<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stark World Engine Anim Preview</title>
<style>
  :root { --bg: #1c1e28; --fg: #e8e8ee; --mute: #9aa0b0; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 10px; bottom: 8px; color: var(--mute); font-size: 12px; pointer-events: none; }
  body.capture #hud { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script src="../runtime/stark_anim.js"></script>
<script src="skin_view.js"></script>
<script>
/* Headless driver API (preview.py) and a small interactive viewer:
   preview.html?model=<url>&clip=<gclip url>&play=<name>   (drag to orbit, wheel to zoom) */
(function () {
  'use strict';
  var cv = document.getElementById('c'), hud = document.getElementById('hud'), V = null, live = false;
  function size(w, h) { cv.width = w || Math.round(innerWidth * (devicePixelRatio || 1)); cv.height = h || Math.round(innerHeight * (devicePixelRatio || 1)); }
  window.GS_PREVIEW = {
    init: function (o) {
      document.body.classList.toggle('capture', !!o.capture);
      size(o.width, o.height);
      return StarkSkinView.create(cv, {model: o.model, dist: o.dist, camYaw: o.camYaw, camPitch: o.camPitch}).then(function (v) {
        V = v; V.rootMotion = o.rootMotion !== false;
        (o.clips || []).forEach(function (c) { V.anim.addClip(c); });
        if (o.play) V.anim.play(o.play, {loop: o.loop !== false});
        if (o.machine) { V.anim.useMachine(o.machine); Object.keys(o.params || {}).forEach(function (k) { V.anim.set(k, o.params[k]); }); }
        V.anim.update(0, V.world); V.draw();
        return {clips: Object.keys(V.anim.clips).length, joints: V.anim.sk.n};
      });
    },
    step: function (dt) { V.render(dt); return V.anim.time; },
    set: function (k, v) { V.anim.set(k, v); }, trigger: function (k) { V.anim.trigger(k); },
    capture: function (fmt) {
      if (fmt === 'raw') { var px = V.pixels(), s = ''; for (var i = 0; i < px.length; i += 32768) s += String.fromCharCode.apply(null, px.subarray(i, i + 32768)); return btoa(s); }
      return cv.toDataURL(fmt === 'jpeg' ? 'image/jpeg' : 'image/png', 0.92).split(',')[1];
    },
    joints2d: function (names) { var o = {}; names.forEach(function (n) { var p = V.jointWorld(n); o[n] = p ? V.project(p).concat([p[0], p[1], p[2]]) : null; }); return o; },
    view: function () { return V; }
  };
  // interactive mode
  var q = new URLSearchParams(location.search);
  if (q.get('model')) {
    live = true;
    var clipUrls = q.getAll('clip');
    Promise.all(clipUrls.map(function (u) { return fetch(u).then(function (r) { return r.json(); }); })).then(function (clips) {
      return GS_PREVIEW.init({model: q.get('model'), clips: clips, play: q.get('play') || (clips[0] && clips[0].name)});
    }).then(function () {
      var last = performance.now(), drag = null;
      cv.onpointerdown = function (e) { drag = [e.clientX, e.clientY, V.cam.yaw, V.cam.pitch]; cv.setPointerCapture(e.pointerId); };
      cv.onpointermove = function (e) { if (!drag) return; V.cam.yaw = drag[2] - (e.clientX - drag[0]) * 0.01; V.cam.pitch = Math.max(-0.2, Math.min(1.2, drag[3] + (e.clientY - drag[1]) * 0.01)); };
      cv.onpointerup = function () { drag = null; };
      cv.onwheel = function (e) { V.cam.dist = Math.max(1.2, Math.min(12, V.cam.dist * (e.deltaY > 0 ? 1.1 : 0.9))); e.preventDefault(); };
      addEventListener('resize', function () { size(); });
      (function loop(now) { var dt = Math.min(0.05, (now - last) / 1000); last = now; V.render(dt); var m = V.anim.layers[0] && V.anim.layers[0].machine;
        hud.textContent = (m ? m.state() : '') + '  t=' + V.anim.time.toFixed(2) + 's  drag: orbit  wheel: zoom'; requestAnimationFrame(loop); })(last);
    }).catch(function (e) { hud.textContent = 'preview failed: ' + e.message; });
  }
})();
</script>
</body>
</html>
